<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Test de la page Login</h1>
    
    <div class="test-section">
        <h2>Test 1: Vérification des fichiers</h2>
        <div id="files-test"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Vérification des fonctions</h2>
        <div id="functions-test"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 3: Test d'inscription</h2>
        <button onclick="testRegistration()">Tester l'inscription</button>
        <div id="registration-test"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 4: Test de connexion</h2>
        <button onclick="testLogin()">Tester la connexion</button>
        <div id="login-test"></div>
    </div>
    
    <div class="test-section">
        <h2>Console d'erreurs</h2>
        <div id="console-errors"></div>
    </div>

    <script>
        // Capturer les erreurs de la console
        const originalError = console.error;
        const errors = [];
        
        console.error = function(...args) {
            errors.push(args.join(' '));
            originalError.apply(console, args);
            updateConsoleErrors();
        };
        
        function updateConsoleErrors() {
            document.getElementById('console-errors').innerHTML = 
                errors.map(error => `<div class="error">${error}</div>`).join('');
        }
        
        // Test 1: Vérification des fichiers
        function testFiles() {
            const files = ['auth.js', 'theme.js', 'script.js', 'styles.css'];
            const results = [];
            
            files.forEach(file => {
                const script = document.createElement('script');
                script.src = file;
                script.onload = () => results.push(`<span class="success">✓ ${file} chargé</span>`);
                script.onerror = () => results.push(`<span class="error">✗ ${file} non trouvé</span>`);
                document.head.appendChild(script);
            });
            
            setTimeout(() => {
                document.getElementById('files-test').innerHTML = results.join('<br>');
            }, 1000);
        }
        
        // Test 2: Vérification des fonctions
        function testFunctions() {
            const functions = [
                'authManager',
                'themeManager', 
                'toggleTheme',
                'testRegistration'
            ];
            
            const results = functions.map(func => {
                if (typeof window[func] !== 'undefined') {
                    return `<span class="success">✓ ${func} disponible</span>`;
                } else {
                    return `<span class="error">✗ ${func} non disponible</span>`;
                }
            });
            
            document.getElementById('functions-test').innerHTML = results.join('<br>');
        }
        
        // Test 3: Test d'inscription
        function testRegistration() {
            const resultDiv = document.getElementById('registration-test');
            resultDiv.innerHTML = '<div>Test en cours...</div>';
            
            try {
                if (typeof authManager !== 'undefined') {
                    const testUser = {
                        firstName: 'Test',
                        lastName: 'User',
                        email: 'test@example.com',
                        password: 'test123',
                        role: 'student',
                        studentId: 'TEST001'
                    };
                    
                    const result = authManager.register(testUser);
                    
                    if (result.success) {
                        resultDiv.innerHTML = '<div class="success">✓ Inscription réussie</div>';
                    } else {
                        resultDiv.innerHTML = `<div class="error">✗ Erreur: ${result.message}</div>`;
                    }
                } else {
                    resultDiv.innerHTML = '<div class="error">✗ AuthManager non disponible</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Erreur: ${error.message}</div>`;
            }
        }
        
        // Test 4: Test de connexion
        function testLogin() {
            const resultDiv = document.getElementById('login-test');
            resultDiv.innerHTML = '<div>Test en cours...</div>';
            
            try {
                if (typeof authManager !== 'undefined') {
                    const result = authManager.login('admin@univ.fr', 'admin123', 'admin');
                    
                    if (result.success) {
                        resultDiv.innerHTML = '<div class="success">✓ Connexion réussie</div>';
                    } else {
                        resultDiv.innerHTML = `<div class="error">✗ Erreur: ${result.message}</div>`;
                    }
                } else {
                    resultDiv.innerHTML = '<div class="error">✗ AuthManager non disponible</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ Erreur: ${error.message}</div>`;
            }
        }
        
        // Lancer les tests au chargement
        document.addEventListener('DOMContentLoaded', function() {
            testFiles();
            testFunctions();
        });
    </script>
    
    <!-- Charger les scripts de l'application -->
    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
