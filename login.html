<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion des Cours Universitaires</title>
    <script>
        // Appliquer le thème immédiatement pour éviter le flash
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const savedRole = localStorage.getItem('userRole') || 'student';
            document.documentElement.classList.add(`theme-${savedTheme}`);
            document.documentElement.classList.add(`role-${savedRole}`);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Bouton de basculement de thème -->
    <button type="button" class="theme-toggle-login">
        <span class="theme-icon-login"></span>
        <span class="theme-text-login">Mode sombre</span>
    </button>

    <div class="login-container">
        <div class="logo">
            <h2>Département de Math-Info</h2>
            <p>Gestion des Cours - Département</p>
        </div>

        <!-- Onglets de navigation -->
        <div class="tab-navigation">
            <button type="button" class="tab-btn active" data-tab="login">Connexion</button>
            <button type="button" class="tab-btn" data-tab="register">Inscription</button>
        </div>

        <!-- Formulaire de connexion -->
        <form id="loginForm" class="form-container active">
            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" autocomplete="username" required placeholder="votre.email@universite.fr">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Votre mot de passe">
            </div>

            <button type="submit" class="login-btn">Se connecter</button>
            <p class="form-feedback" id="loginFeedback" role="status" aria-live="polite"></p>
        </form>

        <!-- Formulaire d'inscription -->
        <form id="registerForm" class="form-container">
            <div class="form-group">
                <label for="reg-firstName">Prénom :</label>
                <input type="text" id="reg-firstName" name="firstName" autocomplete="given-name" required placeholder="Votre prénom">
            </div>

            <div class="form-group">
                <label for="reg-lastName">Nom :</label>
                <input type="text" id="reg-lastName" name="lastName" autocomplete="family-name" required placeholder="Votre nom">
            </div>

            <div class="form-group">
                <label for="reg-email">Email :</label>
                <input type="email" id="reg-email" name="email" autocomplete="email" required placeholder="votre.email@universite.fr">
            </div>

            <div class="form-group">
                <label for="reg-password">Mot de passe :</label>
                <input type="password" id="reg-password" name="password" autocomplete="new-password" required placeholder="Minimum 6 caractères">
            </div>

            <div class="form-group">
                <label for="reg-confirmPassword">Confirmer le mot de passe :</label>
                <input type="password" id="reg-confirmPassword" name="confirmPassword" autocomplete="new-password" required placeholder="Répétez votre mot de passe">
            </div>

            <div class="form-group">
                <label for="reg-studentId">Numéro étudiant :</label>
                <input type="text" id="reg-studentId" name="studentId" placeholder="Ex: 2024001 (optionnel)">
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="reg-confirmInfo" name="confirmInfo" required>
                    <span class="checkmark"></span>
                    Je confirme l'exactitude des informations fournies
                </label>
            </div>

            <button type="submit" class="login-btn">S'inscrire</button>
            <p class="form-feedback" id="registerFeedback" role="status" aria-live="polite"></p>
        </form>

        <div class="demo-accounts">
            <h3>Comptes de démonstration :</h3>
            <button type="button" class="demo-account" data-demo-email="admin@univ.fr" data-demo-password="password123">
                <strong>Administrateur</strong>
                <span>admin@univ.fr / password123</span>
                <span class="demo-action">Utiliser ce compte</span>
            </button>
            <button type="button" class="demo-account" data-demo-email="prof@univ.fr" data-demo-password="password123">
                <strong>Professeur</strong>
                <span>prof@univ.fr / password123</span>
                <span class="demo-action">Utiliser ce compte</span>
            </button>
            <button type="button" class="demo-account" data-demo-email="etudiant@univ.fr" data-demo-password="password123">
                <strong>Étudiant</strong>
                <span>etudiant@univ.fr / password123</span>
                <span class="demo-action">Utiliser ce compte</span>
            </button>
        </div>
    </div>

    <!-- Configuration -->
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
