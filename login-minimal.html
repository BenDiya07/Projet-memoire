<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Minimal - Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: 0 auto; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; }
        .error { color: red; }
        .success { color: green; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login Minimal</h1>
        
        <div class="debug" id="debug">
            <div>Chargement...</div>
        </div>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" value="admin@univ.fr" required>
            <input type="password" id="password" placeholder="Mot de passe" value="admin123" required>
            <select id="role" required>
                <option value="admin">Admin</option>
                <option value="professor">Professeur</option>
                <option value="student">Étudiant</option>
            </select>
            <button type="submit">Se connecter</button>
        </form>
        
        <div id="result"></div>
        
        <button onclick="testAuth()">Test AuthManager</button>
        <button onclick="testLogin()">Test Login</button>
        <button onclick="clearAll()">Reset</button>
    </div>

    <script>
        // Debug info
        function updateDebug() {
            const debug = document.getElementById('debug');
            const info = [
                `AuthManager: ${typeof authManager}`,
                `ThemeManager: ${typeof themeManager}`,
                `Scripts chargés: ${document.scripts.length}`,
                `Erreurs: ${window.errors || 0}`
            ];
            debug.innerHTML = info.map(i => `<div>${i}</div>`).join('');
        }
        
        // Compter les erreurs
        window.errors = 0;
        const originalError = console.error;
        console.error = function(...args) {
            window.errors++;
            originalError.apply(console, args);
            updateDebug();
        };
        
        // Test AuthManager
        function testAuth() {
            const result = document.getElementById('result');
            try {
                if (typeof authManager === 'undefined') {
                    result.innerHTML = '<div class="error">AuthManager non disponible</div>';
                    return;
                }
                
                result.innerHTML = '<div class="success">AuthManager disponible</div>';
                console.log('AuthManager:', authManager);
            } catch (error) {
                result.innerHTML = `<div class="error">Erreur: ${error.message}</div>`;
            }
        }
        
        // Test Login
        function testLogin() {
            const result = document.getElementById('result');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            try {
                if (typeof authManager === 'undefined') {
                    result.innerHTML = '<div class="error">AuthManager non disponible</div>';
                    return;
                }
                
                result.innerHTML = '<div>Test en cours...</div>';
                
                const loginResult = authManager.login(email, password, role);
                
                if (loginResult.success) {
                    result.innerHTML = `<div class="success">Connexion réussie: ${loginResult.user.name}</div>`;
                } else {
                    result.innerHTML = `<div class="error">Erreur: ${loginResult.message}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">Erreur JavaScript: ${error.message}</div>`;
                console.error('Erreur de test:', error);
            }
        }
        
        // Reset
        function clearAll() {
            localStorage.clear();
            location.reload();
        }
        
        // Gestion du formulaire
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            testLogin();
        });
        
        // Mise à jour du debug
        setInterval(updateDebug, 1000);
        
        // Test initial
        setTimeout(() => {
            updateDebug();
            testAuth();
        }, 500);
    </script>
    
    <!-- Scripts -->
    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
